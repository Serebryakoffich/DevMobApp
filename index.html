<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Corporations</title>
<style>
  body { font-family: sans-serif; margin: 40px; max-width: 700px; }
  input, button { padding: 8px; margin: 4px 0; font-size: 15px; width: 100%; box-sizing: border-box; }
  button { cursor: pointer; background: #3ecf8e; color: white; border: none; border-radius: 5px; }
  button:hover { background: #38b980; }
  .card { border: 1px solid #ddd; border-radius: 8px; padding: 20px; margin: 10px 0; }
  .corp-item { background: #f5f5f5; padding: 10px; margin: 6px 0; border-radius: 6px; border-left: 4px solid #3ecf8e; display: flex; justify-content: space-between; align-items: center; }
  .corp-item button { width: auto; margin-left: 5px; padding: 4px 10px; font-size: 14px; }
  #msg { font-weight: bold; min-height: 22px; margin-bottom: 10px; }
  .err { color: red; } .ok { color: green; }

  /* Ссылка-переключатель между входом/регистрацией */
  .switch { margin-top: 15px; text-align: center; font-size: 14px; color: #666; }
  .switch a { color: #3ecf8e; cursor: pointer; text-decoration: underline; }
  .switch a:hover { color: #38b980; }

  /* OAuth-блок: неброский, под формой */
  .oauth-block {
    margin-top: 20px;
    padding-top: 15px;
    border-top: 1px solid #eee;
    text-align: center;
    font-size: 13px;
    color: #888;
  }
  .oauth-block a {
    color: #555;
    text-decoration: none;
    border: 1px solid #ccc;
    padding: 5px 12px;
    border-radius: 4px;
    cursor: pointer;
    margin: 0 3px;
    background: #fff;
    font-size: 13px;
  }
  .oauth-block a:hover { background: #f5f5f5; border-color: #999; }
</style>
</head>
<body>

<p id="msg"></p>

<!-- ===== АВТОРИЗАЦИЯ / РЕГИСТРАЦИЯ ===== -->
<div id="authPanel">
  <!-- Форма входа -->
  <div id="loginBox" class="card">
    <h2 style="margin-top:0">Вход</h2>
    <input type="text" id="loginUser" placeholder="Username">
    <input type="password" id="loginPass" placeholder="Пароль">
    <button onclick="loginLocal()">Войти</button>

    <p class="switch">
      Нет аккаунта? <a onclick="showRegister()">Зарегистрироваться</a>
    </p>

    <div class="oauth-block">
      Или войдите через:
      <a onclick="oauth('github')">GitHub</a>
      <a onclick="yandexLogin()">Яндекс</a>
    </div>
  </div>

  <!-- Форма регистрации -->
  <div id="registerBox" class="card" style="display:none">
    <h2 style="margin-top:0">Регистрация</h2>
    <input type="text" id="regUser" placeholder="Username">
    <input type="password" id="regPass" placeholder="Пароль">
    <button onclick="registerLocal()">Создать аккаунт</button>

    <p class="switch">
      Уже есть аккаунт? <a onclick="showLogin()">Войти</a>
    </p>
  </div>
</div>

<!-- ===== КАБИНЕТ ===== -->
<div id="appPanel" style="display:none">
  <h2>Кабинет: <span id="whoami"></span>
    <button onclick="logout()" style="width:auto; float:right; padding:6px 12px">Выйти</button>
  </h2>

  <div class="card">
    <h3 id="formTitle" style="margin-top:0">Добавить организацию</h3>
    <input type="text" id="corpName" placeholder="Название (name)">
    <input type="text" id="corpActivity" placeholder="Деятельность (activity)">
    <input type="number" id="corpYear" placeholder="Год основания (year_of_foundation)">
    <button id="saveBtn" onclick="saveCorp()">Добавить</button>
    <button onclick="cancelEdit()" id="cancelBtn" style="display:none; background:#999; margin-top:5px">Отмена</button>
  </div>

  <h3>Список организаций</h3>
  <div id="corpsContainer">Загрузка...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ================= КОНФИГ =================
const SUPABASE_URL  = 'https://lzuiudntsxcorceiriqa.supabase.co';
const SUPABASE_KEY  = 'sb_publishable_dT4ixQgQjDctJucWPDTjAw_mWT_Q0ZA';
const YANDEX_APP_ID = 'e282d02bec71452bb88fd995aa6814ba';
const REDIRECT_URI  = location.origin + location.pathname;

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let corpsCache = [];
let editingId = null;

function showMsg(t, c){ const m = document.getElementById('msg'); m.textContent = t; m.className = c || ''; }
function escapeHtml(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function sha256(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

// ===== Переключение форм =====
function showRegister(){
  document.getElementById('loginBox').style.display = 'none';
  document.getElementById('registerBox').style.display = 'block';
  showMsg('');
}
function showLogin(){
  document.getElementById('registerBox').style.display = 'none';
  document.getElementById('loginBox').style.display = 'block';
  showMsg('');
}

// ===== РЕГИСТРАЦИЯ: после успеха сразу логиним =====
async function registerLocal(){
  const username = document.getElementById('regUser').value.trim();
  const password = document.getElementById('regPass').value;
  if (!username || !password) return showMsg('Заполните оба поля!', 'err');

  const { data: exists } = await db.from('users').select('id').eq('username', username).limit(1);
  if (exists && exists.length) return showMsg('Такой username уже занят!', 'err');

  const hash = await sha256(password);
  const { error } = await db.from('users').insert([{ username, password: hash }]);
  if (error) return showMsg('Ошибка регистрации: ' + error.message, 'err');

  // Сразу авторизуем: берём id только что созданного пользователя
  const { data: created } = await db.from('users').select('id').eq('username', username).limit(1);
  if (created && created.length){
    setManualSession('local', username, created[0].id, null);
  } else {
    showMsg('✅ Регистрация успешна! Войдите.', 'ok');
  }
}

// ===== ВХОД =====
async function loginLocal(){
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value;
  if (!username || !password) return showMsg('Заполните оба поля!', 'err');

  const { data, error } = await db.from('users').select('*').eq('username', username).limit(1);
  if (error) return showMsg('Ошибка: ' + error.message, 'err');
  if (!data || !data.length) return showMsg('Пользователь не найден!', 'err');

  const hash = await sha256(password);
  if (data[0].password !== hash) return showMsg('Неверный пароль!', 'err');

  setManualSession('local', username, data[0].id, null);
}

// ===== GITHUB через Supabase OAuth =====
async function oauth(provider){
  const { error } = await db.auth.signInWithOAuth({ provider, options: { redirectTo: REDIRECT_URI } });
  if (error) showMsg('OAuth ошибка: ' + error.message, 'err');
}

// ===== ЯНДЕКС вручную =====
function yandexLogin(){
  location.href = 'https://oauth.yandex.ru/authorize?response_type=token&client_id=' + YANDEX_APP_ID
    + '&redirect_uri=' + encodeURIComponent(REDIRECT_URI) + '&state=yandex';
}

// Обработка возврата с Яндекса (#access_token=...)
(function handleOAuthCallback(){
  if (!location.hash) return;
  const p = new URLSearchParams(location.hash.slice(1));
  const token = p.get('access_token'), state = p.get('state');
  if (!token || state !== 'yandex') return;
  history.replaceState(null, '', location.pathname + location.search);
  yandexProfile(token);
})();

async function yandexProfile(token){
  try {
    const r = await fetch('https://login.yandex.ru/info?format=json&oauth_token=' + token);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const p = await r.json();
    setManualSession('yandex', p.display_name || p.login || p.default_email || 'Яндекс пользователь', p.id, token);
  } catch(e){
    setManualSession('yandex', 'Яндекс пользователь', 'unknown', token);
  }
}

function setManualSession(provider, name, id, token){
  localStorage.setItem('manual_session', JSON.stringify({ provider, name, id, token }));
  init();
}

// ===== СЕССИЯ / ЭКРАНЫ =====
async function init(){
  const { data } = await db.auth.getSession();
  if (data.session){
    const u = data.session.user;
    render({ name: u.user_metadata?.full_name || u.user_metadata?.user_name || u.email,
             provider: u.app_metadata?.provider || 'oauth' });
    return;
  }
  render(JSON.parse(localStorage.getItem('manual_session') || 'null'));
}

function render(user){
  document.getElementById('authPanel').style.display = user ? 'none' : 'block';
  document.getElementById('appPanel').style.display  = user ? 'block' : 'none';
  if (user){
    document.getElementById('whoami').textContent = user.name + ' (' + user.provider + ')';
    loadCorps();
  } else {
    // По возвращении на экран авторизации — показываем форму входа
    document.getElementById('loginBox').style.display = 'block';
    document.getElementById('registerBox').style.display = 'none';
  }
}

async function logout(){
  await db.auth.signOut();
  localStorage.removeItem('manual_session');
  render(null);
  showMsg('Вы вышли.');
}

// ===== CRUD corporations =====
async function loadCorps(){
  const box = document.getElementById('corpsContainer');
  const { data, error } = await db.from('corporations').select('*').order('id');
  if (error){ box.innerHTML = '<span class="err">' + error.message + '</span>'; return; }
  corpsCache = data || [];
  if (!corpsCache.length){ box.innerHTML = '<i>Пока пусто</i>'; return; }
  box.innerHTML = '';
  corpsCache.forEach(c => {
    const d = document.createElement('div');
    d.className = 'corp-item';
    d.innerHTML =
      '<div><strong>' + escapeHtml(c.name) + '</strong> — ' + escapeHtml(c.activity || '—') +
      ' (' + escapeHtml(c.year_of_foundation ?? '—') + ')</div>' +
      '<div>' +
        '<button onclick="editCorp(' + c.id + ')">✏️</button>' +
        '<button onclick="deleteCorp(' + c.id + ')" style="background:#e74c3c">🗑</button>' +
      '</div>';
    box.appendChild(d);
  });
}

async function saveCorp(){
  const name = document.getElementById('corpName').value.trim();
  const activity = document.getElementById('corpActivity').value.trim();
  const year = parseInt(document.getElementById('corpYear').value) || null;
  if (!name) return showMsg('Введите название!', 'err');

  let error;
  if (editingId){
    ({ error } = await db.from('corporations')
      .update({ name, activity, year_of_foundation: year }).eq('id', editingId));
  } else {
    ({ error } = await db.from('corporations')
      .insert([{ name, activity, year_of_foundation: year }]));
  }
  if (error) return showMsg('Ошибка сохранения: ' + error.message, 'err');
  showMsg(editingId ? '✅ Обновлено!' : '✅ Добавлено!', 'ok');
  cancelEdit(); loadCorps();
}

function editCorp(id){
  const c = corpsCache.find(x => x.id === id); if (!c) return;
  editingId = id;
  document.getElementById('corpName').value = c.name || '';
  document.getElementById('corpActivity').value = c.activity || '';
  document.getElementById('corpYear').value = c.year_of_foundation ?? '';
  document.getElementById('formTitle').textContent = 'Редактирование #' + id;
  document.getElementById('saveBtn').textContent = 'Сохранить';
  document.getElementById('cancelBtn').style.display = 'inline-block';
}
function cancelEdit(){
  editingId = null;
  ['corpName','corpActivity','corpYear'].forEach(i => document.getElementById(i).value = '');
  document.getElementById('formTitle').textContent = 'Добавить организацию';
  document.getElementById('saveBtn').textContent = 'Добавить';
  document.getElementById('cancelBtn').style.display = 'none';
}
async function deleteCorp(id){
  const c = corpsCache.find(x => x.id === id);
  if (!confirm('Удалить "' + (c?.name || id) + '"?')) return;
  const { error } = await db.from('corporations').delete().eq('id', id);
  if (error) return showMsg('Ошибка удаления: ' + error.message, 'err');
  showMsg('🗑 Удалено.', 'ok'); loadCorps();
}

init();
</script>
</body>
</html>
