<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Corporations + OAuth</title>
<style>
  body { font-family: sans-serif; margin: 40px; max-width: 700px; }
  input, button { padding: 8px; margin: 4px 0; font-size: 15px; }
  button { cursor: pointer; }
  .oauth-btn { width: 220px; margin: 3px; }
  .card { border: 1px solid #ddd; border-radius: 8px; padding: 15px; margin: 10px 0; }
  .corp-item { background: #f5f5f5; padding: 10px; margin: 6px 0; border-radius: 6px; border-left: 4px solid #3ecf8e; }
  #msg { font-weight: bold; min-height: 22px; }
  .err { color: red; } .ok { color: green; }
</style>
</head>
<body>

<p id="msg"></p>

<!-- ===== ВХОД / РЕГИСТРАЦИЯ через ВАШУ таблицу users ===== -->
<div id="authPanel">
  <h2>Вход</h2>
  <div class="card">
    <input type="text" id="loginUser" placeholder="Username"><br>
    <input type="password" id="loginPass" placeholder="Пароль"><br>
    <button onclick="loginLocal()">Авторизация</button>
  </div>

  <h2>Регистрация</h2>
  <div class="card">
    <input type="text" id="regUser" placeholder="Username"><br>
    <input type="password" id="regPass" placeholder="Пароль"><br>
    <button onclick="registerLocal()">Регистрация</button>
  </div>

  <h2>Вход через провайдеров</h2>
  <div class="card">
    <button class="oauth-btn" onclick="oauth('github')">Войти через GitHub</button><br>
    <button class="oauth-btn" onclick="oauth('google')">Войти через Google</button><br>
    <button class="oauth-btn" onclick="oauth('apple')">Войти через Apple</button><br>
    <hr>
    <button class="oauth-btn" onclick="vkLogin()">Войти через VK</button><br>
    <button class="oauth-btn" onclick="yandexLogin()">Войти через Яндекс</button>
  </div>
</div>

<!-- ===== КАБИНЕТ: CRUD corporations ===== -->
<div id="appPanel" style="display:none">
  <h2>Кабинет: <span id="whoami"></span>
    <button onclick="logout()">Выйти</button>
  </h2>

  <div class="card">
    <h3 id="formTitle">Добавить организацию</h3>
    <input type="text" id="corpName" placeholder="Название (name)"><br>
    <input type="text" id="corpActivity" placeholder="Деятельность (activity)"><br>
    <input type="number" id="corpYear" placeholder="Год основания (year_of_foundation)"><br>
    <button id="saveBtn" onclick="saveCorp()">Добавить</button>
    <button onclick="cancelEdit()" id="cancelBtn" style="display:none">Отмена</button>
  </div>

  <h3>Список организаций</h3>
  <div id="corpsContainer">Загрузка...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ================= КОНФИГ =================
const SUPABASE_URL  = 'https://lzuiudntsxcorceiriqa.supabase.co';
const SUPABASE_KEY  = 'sb_publishable_dT4ixQgQjDctJucWPDTjAw_mWT_Q0ZA';
const VK_APP_ID     = '00000000';   // ⚠️ числовой ID приложения VK
const YANDEX_APP_ID = 'e282d02bec71452bb88fd995aa6814ba';   // ⚠️ числовой ID приложения Яндекс
const REDIRECT_URI  = location.origin + location.pathname;

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let corpsCache = [];
let editingId = null;

function showMsg(t, c){ const m = document.getElementById('msg'); m.textContent = t; m.className = c || ''; }
function escapeHtml(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// Хеширование пароля SHA-256 (встроенный браузерный API, pure JS)
async function sha256(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

// ===== РЕГИСТРАЦИЯ через ВАШУ таблицу users =====
async function registerLocal(){
  const username = document.getElementById('regUser').value.trim();
  const password = document.getElementById('regPass').value;
  if (!username || !password) return showMsg('Заполните оба поля!', 'err');

  // проверяем, не занят ли username
  const { data: exists } = await db.from('users').select('id').eq('username', username).limit(1);
  if (exists && exists.length) return showMsg('Такой username уже занят!', 'err');

  const hash = await sha256(password);
  const { error } = await db.from('users').insert([{ username, password: hash }]); // id не передаём!
  if (error) return showMsg('Ошибка регистрации: ' + error.message, 'err');
  showMsg('✅ Регистрация успешна! Теперь войдите.', 'ok');
}

// ===== ВХОД через ВАШУ таблицу users =====
async function loginLocal(){
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value;
  if (!username || !password) return showMsg('Заполните оба поля!', 'err');

  const { data, error } = await db.from('users').select('*').eq('username', username).limit(1);
  if (error) return showMsg('Ошибка: ' + error.message, 'err');
  if (!data || !data.length) return showMsg('Пользователь не найден!', 'err');

  const hash = await sha256(password);
  if (data[0].password !== hash) return showMsg('Неверный пароль!', 'err');

  setManualSession('local', username, data[0].id, null);
}

// ===== GITHUB / GOOGLE / APPLE через Supabase =====
async function oauth(provider){
  const { error } = await db.auth.signInWithOAuth({ provider, options: { redirectTo: REDIRECT_URI } });
  if (error) showMsg('OAuth ошибка: ' + error.message, 'err');
}

// ===== VK / ЯНДЕКС вручную =====
function vkLogin(){
  location.href = 'https://oauth.vk.com/authorize?client_id=' + VK_APP_ID
    + '&redirect_uri=' + encodeURIComponent(REDIRECT_URI)
    + '&response_type=token&v=5.199&display=page&state=vk';
}
function yandexLogin(){
  location.href = 'https://oauth.yandex.ru/authorize?response_type=token&client_id=' + YANDEX_APP_ID
    + '&redirect_uri=' + encodeURIComponent(REDIRECT_URI) + '&state=yandex';
}

(function handleOAuthCallback(){
  if (!location.hash) return;
  const p = new URLSearchParams(location.hash.slice(1));
  const token = p.get('access_token'), state = p.get('state');
  if (!token || (state !== 'vk' && state !== 'yandex')) return;
  history.replaceState(null, '', location.pathname + location.search);
  if (state === 'vk') vkProfile(token, p.get('user_id'));
  else yandexProfile(token);
})();

function vkProfile(token, userId){
  const cb = 'vkCb_' + Date.now();
  const s = document.createElement('script');
  window[cb] = r => { delete window[cb]; s.remove();
    const u = r.response && r.response[0];
    setManualSession('vk', u ? u.first_name + ' ' + u.last_name : 'VK user #' + userId, userId, token);
  };
  s.onerror = () => { delete window[cb]; s.remove(); setManualSession('vk', 'VK user #' + userId, userId, token); };
  s.src = 'https://api.vk.com/method/users.get?user_ids=' + userId + '&access_token=' + token + '&v=5.199&callback=' + cb;
  document.body.appendChild(s);
}

async function yandexProfile(token){
  try {
    const r = await fetch('https://login.yandex.ru/info?format=json&oauth_token=' + token);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const p = await r.json();
    setManualSession('yandex', p.display_name || p.login || p.default_email || 'Яндекс пользователь', p.id, token);
  } catch(e){
    setManualSession('yandex', 'Яндекс пользователь', 'unknown', token);
  }
}

function setManualSession(provider, name, id, token){
  localStorage.setItem('manual_session', JSON.stringify({ provider, name, id, token }));
  init();
}

// ===== СЕССИЯ / ЭКРАНЫ =====
async function init(){
  const { data } = await db.auth.getSession();          // сессии GitHub/Google/Apple
  if (data.session){
    const u = data.session.user;
    render({ name: u.user_metadata?.full_name || u.user_metadata?.user_name || u.email,
             provider: u.app_metadata?.provider || 'oauth' });
    return;
  }
  render(JSON.parse(localStorage.getItem('manual_session') || 'null')); // local / vk / yandex
}

function render(user){
  document.getElementById('authPanel').style.display = user ? 'none' : 'block';
  document.getElementById('appPanel').style.display  = user ? 'block' : 'none';
  if (user){
    document.getElementById('whoami').textContent = user.name + ' (' + user.provider + ')';
    loadCorps();
  }
}

async function logout(){
  await db.auth.signOut();
  localStorage.removeItem('manual_session');
  render(null);
  showMsg('Вы вышли.');
}

// ===== CRUD corporations (id НЕ передаём — он serial) =====
async function loadCorps(){
  const box = document.getElementById('corpsContainer');
  const { data, error } = await db.from('corporations').select('*').order('id');
  if (error){ box.innerHTML = '<span class="err">' + error.message + '</span>'; return; }
  corpsCache = data || [];
  if (!corpsCache.length){ box.innerHTML = '<i>Пока пусто</i>'; return; }
  box.innerHTML = '';
  corpsCache.forEach(c => {
    const d = document.createElement('div');
    d.className = 'corp-item';
    d.innerHTML = '<strong>' + escapeHtml(c.name) + '</strong> — ' + escapeHtml(c.activity || '—')
      + ' (' + escapeHtml(c.year_of_foundation ?? '—') + ') '
      + '<button onclick="editCorp(' + c.id + ')">✏️</button> '
      + '<button onclick="deleteCorp(' + c.id + ')">🗑</button>';
    box.appendChild(d);
  });
}

async function saveCorp(){
  const name = document.getElementById('corpName').value.trim();
  const activity = document.getElementById('corpActivity').value.trim();
  const year = parseInt(document.getElementById('corpYear').value) || null;
  if (!name) return showMsg('Введите название!', 'err');

  let error;
  if (editingId){
    ({ error } = await db.from('corporations')
      .update({ name, activity, year_of_foundation: year }).eq('id', editingId));
  } else {
    ({ error } = await db.from('corporations')
      .insert([{ name, activity, year_of_foundation: year }]));   // без id!
  }
  if (error) return showMsg('Ошибка сохранения: ' + error.message, 'err');
  showMsg(editingId ? '✅ Обновлено!' : '✅ Добавлено!', 'ok');
  cancelEdit(); loadCorps();
}

function editCorp(id){
  const c = corpsCache.find(x => x.id === id); if (!c) return;
  editingId = id;
  document.getElementById('corpName').value = c.name || '';
  document.getElementById('corpActivity').value = c.activity || '';
  document.getElementById('corpYear').value = c.year_of_foundation ?? '';
  document.getElementById('formTitle').textContent = 'Редактирование #' + id;
  document.getElementById('saveBtn').textContent = 'Сохранить';
  document.getElementById('cancelBtn').style.display = 'inline';
}
function cancelEdit(){
  editingId = null;
  ['corpName','corpActivity','corpYear'].forEach(i => document.getElementById(i).value = '');
  document.getElementById('formTitle').textContent = 'Добавить организацию';
  document.getElementById('saveBtn').textContent = 'Добавить';
  document.getElementById('cancelBtn').style.display = 'none';
}
async function deleteCorp(id){
  const c = corpsCache.find(x => x.id === id);
  if (!confirm('Удалить "' + (c?.name || id) + '"?')) return;
  const { error } = await db.from('corporations').delete().eq('id', id);
  if (error) return showMsg('Ошибка удаления: ' + error.message, 'err');
  showMsg('🗑 Удалено.', 'ok'); loadCorps();
}

init();
</script>
</body>
</html>
