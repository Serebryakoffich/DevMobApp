<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Corporations + OAuth</title>
<style>
  body { font-family: sans-serif; margin: 40px; max-width: 700px; }
  input, button { padding: 8px; margin: 4px 0; font-size: 15px; }
  button { cursor: pointer; }
  .oauth-btn { width: 220px; margin: 3px; }
  .card { border: 1px solid #ddd; border-radius: 8px; padding: 15px; margin: 10px 0; }
  .corp-item { background: #f5f5f5; padding: 10px; margin: 6px 0; border-radius: 6px; border-left: 4px solid #3ecf8e; }
  #msg { font-weight: bold; min-height: 22px; }
  .err { color: red; } .ok { color: green; }
</style>
</head>
<body>

<p id="msg"></p>

<!-- ===== ЭКРАН 1 и 2: АВТОРИЗАЦИЯ + РЕГИСТРАЦИЯ + OAUTH ===== -->
<div id="authPanel">
  <h2>Вход</h2>
  <div class="card">
    <input type="username" id="loginUsername" placeholder="Имя"><br>
    <input type="password" id="loginPass" placeholder="Пароль"><br>
    <button onclick="loginEmail()">Авторизация</button>
  </div>

  <h2>Регистрация</h2>
  <div class="card">
    <input type="username" id="regUsername" placeholder="Имя"><br>
    <input type="password" id="regPass" placeholder="Пароль"><br>
    <button onclick="registerEmail()">Регистрация</button>
  </div>

  <h2>Вход через провайдеров</h2>
  <div class="card">
    <!-- Через Supabase -->
    <button class="oauth-btn" onclick="oauth('github')">Войти через GitHub</button><br>
    <hr>
    <!-- Вручную (Implicit Flow) -->
    <button class="oauth-btn" onclick="vkLogin()">Войти через VK</button><br>
    <button class="oauth-btn" onclick="yandexLogin()">Войти через Яндекс</button>
  </div>
</div>

<!-- ===== ЭКРАН 3: РАБОТА С ТАБЛИЦЕЙ ===== -->
<div id="appPanel" style="display:none">
  <h2>Кабинет: <span id="whoami"></span>
    <button onclick="logout()">Выйти</button>
  </h2>

  <div class="card">
    <h3 id="formTitle">Добавить организацию</h3>
    <input type="text" id="corpName" placeholder="Название"><br>
    <input type="text" id="corpActivity" placeholder="Деятельность"><br>
    <input type="number" id="corpYear" placeholder="Год основания"><br>
    <button id="saveBtn" onclick="saveCorp()">Добавить</button>
    <button onclick="cancelEdit()" id="cancelBtn" style="display:none">Отмена</button>
  </div>

  <h3>Список организаций</h3>
  <div id="corpsContainer">Загрузка...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ================= КОНФИГ =================
const SUPABASE_URL = 'https://lzuiudntsxcorceiriqa.supabase.co';
const SUPABASE_KEY = 'sb_publishable_dT4ixQgQjDctJucWPDTjAw_mWT_Q0ZA';
const VK_APP_ID    = '00000000';   // ⚠️ вставьте App ID вашего VK-приложения
const YANDEX_APP_ID = 'xxxxxxxx';  // ⚠️ вставьте App ID вашего Яндекс-приложения
const REDIRECT_URI = location.origin + location.pathname; // куда вернёт провайдер

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let corpsCache = [];
let editingId = null;

// ================= ХЕЛПЕРЫ =================
function showMsg(text, cls) {
  const m = document.getElementById('msg');
  m.textContent = text;
  m.className = cls || '';
}
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ================= ЭКРАН 1: ВХОД / ЭКРАН 2: РЕГИСТРАЦИЯ =================
async function loginEmail() {
  const { error } = await db.auth.signInWithPassword({
    email: document.getElementById('loginEmail').value,
    password: document.getElementById('loginPass').value
  });
  if (error) return showMsg('Ошибка входа: ' + error.message, 'err');
  init();
}

async function registerEmail() {
  const { data, error } = await db.auth.signUp({
    email: document.getElementById('regEmail').value,
    password: document.getElementById('regPass').value
  });
  if (error) return showMsg('Ошибка регистрации: ' + error.message, 'err');
  showMsg('✅ Регистрация успешна! Проверьте почту для подтверждения.', 'ok');
}

// ================= GITHUB / GOOGLE / APPLE (через Supabase) =================
async function oauth(provider) {
  const { error } = await db.auth.signInWithOAuth({
    provider: provider, // 'github' | 'google' | 'apple'
    options: { redirectTo: REDIRECT_URI }
  });
  if (error) showMsg('OAuth ошибка: ' + error.message, 'err');
  // при успехе браузер сам уйдёт на страницу провайдера
}

// ================= VK / ЯНДЕКС (вручную, Implicit Flow) =================
function vkLogin() {
  location.href = 'https://oauth.vk.com/authorize'
    + '?client_id=' + VK_APP_ID
    + '&redirect_uri=' + encodeURIComponent(REDIRECT_URI)
    + '&response_type=token&v=5.199&display=page&state=vk';
}

function yandexLogin() {
  location.href = 'https://oauth.yandex.ru/authorize'
    + '?response_type=token'
    + '&client_id=' + YANDEX_APP_ID
    + '&redirect_uri=' + encodeURIComponent(REDIRECT_URI)
    + '&state=yandex';
}

// Обработка возврата от VK/Яндекс: токен приходит в #access_token=...
(function handleOAuthCallback() {
  if (!location.hash) return;
  const p = new URLSearchParams(location.hash.slice(1));
  const token = p.get('access_token');
  const state = p.get('state');
  if (!token || (state !== 'vk' && state !== 'yandex')) return;

  history.replaceState(null, '', location.pathname + location.search); // чистим URL

  if (state === 'vk') vkProfile(token, p.get('user_id'));
  else yandexProfile(token);
})();

// VK: профиль получаем через JSONP (api.vk.com не любит CORS, а JSONP работает всегда)
function vkProfile(token, userId) {
  const cbName = 'vkCb_' + Date.now();
  const s = document.createElement('script');
  window[cbName] = (resp) => {
    delete window[cbName]; s.remove();
    const u = resp.response && resp.response[0];
    setManualSession('vk', u ? (u.first_name + ' ' + u.last_name) : ('VK user #' + userId), userId, token);
  };
  s.onerror = () => { delete window[cbName]; s.remove(); setManualSession('vk', 'VK user #' + userId, userId, token); };
  s.src = 'https://api.vk.com/method/users.get?user_ids=' + userId
        + '&fields=photo_100&access_token=' + token + '&v=5.199&callback=' + cbName;
  document.body.appendChild(s);
}

// Яндекс: профиль через fetch
async function yandexProfile(token) {
  try {
    const r = await fetch('https://login.yandex.ru/info?format=json&oauth_token=' + token);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const p = await r.json();
    setManualSession('yandex', p.display_name || p.login || p.default_email || 'Яндекс пользователь', p.id, token);
  } catch (e) {
    // Если CORS заблокировал запрос профиля — токен всё равно доказывает вход
    showMsg('Яндекс: вход выполнен, но запрос профиля заблокирован CORS: ' + e.message, 'err');
    setManualSession('yandex', 'Яндекс пользователь', 'unknown', token);
  }
}

function setManualSession(provider, name, id, token) {
  localStorage.setItem('manual_session', JSON.stringify({ provider, name, id, token }));
  init();
}

// ================= СЕССИЯ И ПЕРЕКЛЮЧЕНИЕ ЭКРАНОВ =================
async function init() {
  // 1) Сначала сессия Supabase (email, github, google, apple)
  const { data } = await db.auth.getSession();
  if (data.session) {
    const u = data.session.user;
    render({
      name: u.user_metadata?.full_name || u.user_metadata?.name || u.email,
      provider: u.app_metadata?.provider || 'email'
    });
    return;
  }
  // 2) Иначе ручная сессия (vk / yandex)
  const ms = JSON.parse(localStorage.getItem('manual_session') || 'null');
  render(ms);
}

function render(user) {
  document.getElementById('authPanel').style.display = user ? 'none' : 'block';
  document.getElementById('appPanel').style.display  = user ? 'block' : 'none';
  if (user) {
    document.getElementById('whoami').textContent = user.name + ' (' + user.provider + ')';
    loadCorps();
  }
}

async function logout() {
  await db.auth.signOut();
  localStorage.removeItem('manual_session');
  render(null);
  showMsg('Вы вышли из системы.');
}

// ================= ЭКРАН 3: CRUD ТАБЛИЦЫ corporations =================
async function loadCorps() {
  const container = document.getElementById('corpsContainer');
  const { data, error } = await db.from('corporations').select('*').order('id');
  if (error) { container.innerHTML = '<span class="err">Ошибка: ' + error.message + '</span>'; return; }
  corpsCache = data || [];
  if (!corpsCache.length) { container.innerHTML = '<i>Пока пусто</i>'; return; }

  container.innerHTML = '';
  corpsCache.forEach(c => {
    const div = document.createElement('div');
    div.className = 'corp-item';
    div.innerHTML =
      '<strong>' + escapeHtml(c.name) + '</strong> — ' + escapeHtml(c.activity || '—') +
      ' (' + escapeHtml(c.year_of_foundation ?? '—') + ') ' +
      '<button onclick="editCorp(' + c.id + ')">✏️ Ред.</button> ' +
      '<button onclick="deleteCorp(' + c.id + ')">🗑 Удалить</button>';
    container.appendChild(div);
  });
}

async function saveCorp() {
  const name = document.getElementById('corpName').value.trim();
  const activity = document.getElementById('corpActivity').value.trim();
  const year = parseInt(document.getElementById('corpYear').value) || null;
  if (!name) return showMsg('Введите название!', 'err');

  let error;
  if (editingId) {
    ({ error } = await db.from('corporations')
      .update({ name, activity, year_of_foundation: year })
      .eq('id', editingId));
  } else {
    ({ error } = await db.from('corporations')
      .insert([{ name, activity, year_of_foundation: year }]));
  }
  if (error) return showMsg('Ошибка сохранения: ' + error.message, 'err');

  showMsg(editingId ? '✅ Обновлено!' : '✅ Добавлено!', 'ok');
  cancelEdit();
  loadCorps();
}

function editCorp(id) {
  const c = corpsCache.find(x => x.id === id);
  if (!c) return;
  editingId = id;
  document.getElementById('corpName').value = c.name || '';
  document.getElementById('corpActivity').value = c.activity || '';
  document.getElementById('corpYear').value = c.year_of_foundation ?? '';
  document.getElementById('formTitle').textContent = 'Редактирование #' + id;
  document.getElementById('saveBtn').textContent = 'Сохранить';
  document.getElementById('cancelBtn').style.display = 'inline';
}

function cancelEdit() {
  editingId = null;
  document.getElementById('corpName').value = '';
  document.getElementById('corpActivity').value = '';
  document.getElementById('corpYear').value = '';
  document.getElementById('formTitle').textContent = 'Добавить организацию';
  document.getElementById('saveBtn').textContent = 'Добавить';
  document.getElementById('cancelBtn').style.display = 'none';
}

async function deleteCorp(id) {
  const c = corpsCache.find(x => x.id === id);
  if (!confirm('Удалить "' + (c?.name || id) + '"?')) return;
  const { error } = await db.from('corporations').delete().eq('id', id);
  if (error) return showMsg('Ошибка удаления: ' + error.message, 'err');
  showMsg('🗑 Удалено.', 'ok');
  loadCorps();
}

// ================= СТАРТ =================
init();
</script>
</body>
</h
