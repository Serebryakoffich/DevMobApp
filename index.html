<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация Supabase</title>
    <style>
        body { font-family: sans-serif; margin: 50px; }
        .form-wrapper { max-width: 300px; display: flex; flex-direction: column; gap: 10px; }
        input, button { padding: 10px; font-size: 16px; }
        button { 
            cursor: pointer; 
            background: #3ecf8e; 
            color: white; 
            border: none; 
            border-radius: 5px; 
        }
        button:hover { background: #38b980; }
        #message { margin-top: 15px; font-weight: bold; min-height: 20px; }
        
        #usersList { margin-top: 30px; max-width: 400px; }
        #usersList h3 { border-bottom: 2px solid #3ecf8e; padding-bottom: 5px; }
        .user-item {
            background: #f4f4f4;
            padding: 10px 15px;
            margin-bottom: 8px;
            border-radius: 5px;
            border-left: 4px solid #3ecf8e;
            font-family: monospace;
        }
        .empty-list { color: #999; font-style: italic; }
    </style>
</head>
<body>

    <h2>Форма регистрации</h2>
    <div class="form-wrapper">
        <label for="username">Username:</label>
        <input type="text" id="username">
        
        <label for="password">Password:</label>
        <input type="password" id="password">
        
        <button onclick="register()">Регистрация</button>
    </div>
    <p id="message"></p>

    <div id="usersList">
        <h3>Зарегистрированные пользователи</h3>
        <div id="usersContainer"><span class="empty-list">Загрузка...</span></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://lzuiudntsxcorceiriqa.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_dT4ixQgQjDctJucWPDTjAw_mWT_Q0ZA';
        const TABLE_NAME = 'users';
        
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function loadUsers() {
            const container = document.getElementById('usersContainer');
            
            const { data, error } = await db
                .from(TABLE_NAME)
                .select('*')

            if (error) {
                container.innerHTML = `<span style="color:red;">Ошибка: ${error.message}</span>`;
                return;
            }

            if (!data || data.length === 0) {
                container.innerHTML = '<span class="empty-list">Пока нет пользователей</span>';
                return;
            }

            container.innerHTML = '';

            data.forEach((user, index) => {
                const userDiv = document.createElement('div');
                userDiv.className = 'user-item';
                userDiv.innerHTML = `<span>#${index + 1}</span> — <strong>${user.username}</strong>`;                container.appendChild(userDiv);
            });
        }

        async function register() {
            const messageEl = document.getElementById('message');
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            if (!username || !password) {
                messageEl.textContent = '❌ Заполните оба поля!';
                messageEl.style.color = 'red';
                return;
            }

            messageEl.textContent = 'Отправка...';
            messageEl.style.color = 'black';

            const { error } = await db
                .from(TABLE_NAME)
                .insert([{ username: username, password: password }]);

            if (error) {
                messageEl.textContent = '❌ Ошибка: ' + error.message;
                messageEl.style.color = 'red';
            } else {
                messageEl.textContent = '✅ Успешная регистрация!';
                messageEl.style.color = 'green';
                document.getElementById('username').value = '';
                document.getElementById('password').value = '';
                loadUsers(); 
            }
        }

        loadUsers();
    </script>
</body>
</html>
